name: django-ci
on:
  push:
    branches: 
      - testing
      - master
  pull_request:
    branches: 
      - testing
      - master

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: mk
        shell: bash
        run: |
          matrix_json="$(python - <<'PY'
          import json, pathlib, os
          services=[]
          for p in pathlib.Path("services").glob("*/manage.py"):
              d=str(p.parent)
              services.append({"name": os.path.basename(d), "path": d})
          print(json.dumps({"service": services}))
          PY
          )"
          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"
  test:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.service.path }}
    steps:
      - uses: actions/checkout@v5

      # Optional: only vendor shared if the repo has services/shared
      - name: Vendor shared into service
        run: |
          mkdir -p shared
          if [ -d "$GITHUB_WORKSPACE/services/shared" ]; then
            cp -a "$GITHUB_WORKSPACE/services/shared/." "./shared/"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service.path }}/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install shared library (repetika_common)
          pip install -e "$GITHUB_WORKSPACE/common"
          # Service-specific dependencies
          pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Run unit tests
        run: |
          if [ "${{ matrix.service.name }}" = "authentification_service" ]; then
            python manage.py test --settings=core.test_settings
          else
            python manage.py test
          fi
