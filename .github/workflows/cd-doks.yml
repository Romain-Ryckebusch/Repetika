name: repetika-doks-cd


on:
  push:
    branches:
      - master
      - testing # Temporary while validating deployment. TODO: Remove later once validated

#on:
#  workflow_run:
#    workflows:
#      - django-ci
#    types:
#      - completed
#    branches:
#      - master
#      - testing 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Deploy-DO

    env:
      REGISTRY_NAME: ${{ secrets.REGISTRY_NAME }}
      CLUSTER_NAME: ${{ secrets.CLUSTER_NAME }}
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ env.DO_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Compute image tag
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
  
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and push backend images
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          REGISTRY_NAME: ${{ env.REGISTRY_NAME }}
        run: |
          set -euo pipefail

          docker buildx create --use --name repetika-builder || docker buildx use repetika-builder

          services=(
            "main-service:services/main_service/Dockerfile"
            "decks-service:services/decks_service/Dockerfile"
            "cours-service:services/cours_service/Dockerfile"
            "planning-service:services/planning_service/Dockerfile"
            "session-service:services/session_service/Dockerfile"
            "quiz-service:services/quiz_service/Dockerfile"
            "authentification-service:services/authentification_service/Dockerfile"
          )

          for spec in "${services[@]}"; do
            image_name="${spec%%:*}"
            dockerfile="${spec#*:}"

            echo "Building $image_name from $dockerfile"

            docker buildx build \
              --file "$dockerfile" \
              --tag "$REGISTRY_NAME/$image_name:$TAG" \
              --cache-from "type=registry,ref=$REGISTRY_NAME/$image_name:buildcache" \
              --cache-to "type=registry,ref=$REGISTRY_NAME/$image_name:buildcache,mode=max" \
              --push \
              .
          done

      - name: Build and push web-frontend
        uses: docker/build-push-action@v5
        with:
          context: apps/mobile/RepetikaApp
          file: apps/mobile/RepetikaApp/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_NAME }}/web-frontend:${{ steps.vars.outputs.tag }}
          build-args: |
            EXPO_PUBLIC_API_URL=${{ env.EXPO_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Terraform init
        working-directory: .
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_do_token: ${{ env.DO_TOKEN }}
          TF_VAR_cluster_name: ${{ env.CLUSTER_NAME }}
          TF_VAR_image_registry: ${{ env.REGISTRY_NAME }}
          TF_VAR_image_tag: ${{ steps.vars.outputs.tag }}
          TF_VAR_django_secret_key: ${{ env.DJANGO_SECRET_KEY }}
          TF_VAR_postgres_password: ${{ env.POSTGRES_PASSWORD }}
        run: terraform init -input=false

      - name: Terraform apply
        working-directory: .
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_do_token: ${{ env.DO_TOKEN }}
          TF_VAR_cluster_name: ${{ env.CLUSTER_NAME }}
          TF_VAR_image_registry: ${{ env.REGISTRY_NAME }}
          TF_VAR_image_tag: ${{ steps.vars.outputs.tag }}
          TF_VAR_django_secret_key: ${{ env.DJANGO_SECRET_KEY }}
          TF_VAR_postgres_password: ${{ env.POSTGRES_PASSWORD }}
        run: terraform apply -auto-approve -input=false
