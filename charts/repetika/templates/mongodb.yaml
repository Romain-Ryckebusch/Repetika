apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    {{- include "repetika.labels" . | nindent 4 }}
spec:
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
  selector:
    app: mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  labels:
    {{- include "repetika.labels" . | nindent 4 }}
  annotations:
    checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: {{ .Values.mongo.image | quote }}
          args: ["--bind_ip_all"]
          ports:
            - containerPort: 27017
              name: mongo
          env:
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "repetika.fullname" . }}-config
                  key: MONGO_DB
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
{{- if .Values.mongoSeed.enabled }}
            # If your seed files are Mongo init scripts, mount them here:
            - name: mongo-seed
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
{{- end }}
      volumes:
{{- if .Values.mongoSeed.enabled }}
        - name: mongo-seed
          configMap:
            name: {{ include "repetika.fullname" . }}-mongo-seed
{{- end }}
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.mongo.storage.size | quote }}
