{{- if and .Values.monitoring.enabled .Values.monitoring.cadvisor.enabled }}

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cadvisor
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    matchLabels:
      app: cadvisor
  template:
    metadata:
      labels:
        app: cadvisor
    spec:
      containers:
        - name: cadvisor
          image: {{ .Values.monitoring.cadvisor.image }}
          securityContext:
            privileged: true
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: rootfs
              mountPath: /rootfs
              readOnly: true
            - name: var-run
              mountPath: /var/run
              readOnly: false
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: docker
              mountPath: /var/lib/docker
              readOnly: true
      volumes:
        - name: rootfs
          hostPath:
            path: /
        - name: var-run
          hostPath:
            path: /var/run
        - name: sys
          hostPath:
            path: /sys
        - name: docker
          hostPath:
            path: /var/lib/docker

---
apiVersion: v1
kind: Service
metadata:
  name: cadvisor
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app: cadvisor
  ports:
    - port: 8070
      targetPort: 8080

{{- end }}
