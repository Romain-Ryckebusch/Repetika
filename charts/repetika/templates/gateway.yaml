apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "repetika.fullname" . }}-nginx
data:
  nginx.conf: |
{{ .Files.Get "files/nginx.conf" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: {{ .Values.gateway.image | quote }}
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "repetika.fullname" . }}-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: {{ .Values.gateway.service.nodePort }}
