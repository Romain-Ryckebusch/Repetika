apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
      annotations:
        checksum/nginx-config: {{ (.Files.Get "nginx.conf" | sha256sum) }} # To trigger rollout on nginx config change
    spec:
      containers:
        - name: gateway
          securityContext:
            allowPrivilegeEscalation: false
          image: nginx:1.25
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          ports:
            - containerPort: 80
      volumes:
        - name: nginx-config
          configMap:
            name: gateway-nginx-config
            items:
              - key: nginx.conf
                path: nginx.conf
