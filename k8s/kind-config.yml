# k8s/kind-config.yml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080    # K8s Service/Ingress for API
        hostPort: 8080
        protocol: TCP
      - containerPort: 32000  # Grafana
        hostPort: 3000
        protocol: TCP
      - containerPort: 32001 # Prometheus
        hostPort: 9090
        protocol: TCP

